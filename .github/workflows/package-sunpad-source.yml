name: Package SunPad source

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/package-sunpad-source.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SunPad v0.3.1 and its submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chrissotraidis/sunpad
          ref: v0.3.1
          submodules: recursive
          persist-credentials: false
          path: sunpad

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude-vcs -czf "$RUNNER_TEMP/sunpad-v0.3.1-source.tar.gz" -C sunpad .
          sha256sum "$RUNNER_TEMP/sunpad-v0.3.1-source.tar.gz" > "$RUNNER_TEMP/sunpad-v0.3.1-source.tar.gz.sha256"
          tar -tzf "$RUNNER_TEMP/sunpad-v0.3.1-source.tar.gz" >/dev/null

      - name: Upload source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunpad-v0.3.1-source
          path: |
            ${{ runner.temp }}/sunpad-v0.3.1-source.tar.gz
            ${{ runner.temp }}/sunpad-v0.3.1-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
