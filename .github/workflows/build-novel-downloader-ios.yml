name: Build Novel Downloader IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'NovelDownloaderIOS/**'
      - 'NovelDownloaderIOS.xcodeproj/**'
      - 'scripts/build_novel_downloader_ipa.sh'
      - '.github/workflows/build-novel-downloader-ios.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash scripts/build_novel_downloader_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovelDownloader-unsigned
          path: build-output/NovelDownloader.ipa
          if-no-files-found: error
