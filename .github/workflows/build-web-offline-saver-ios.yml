name: Build Web Offline Saver IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'WebOfflineSaverIOS/**'
      - 'WebOfflineSaverIOS.xcodeproj/**'
      - 'scripts/build_web_offline_saver_ipa.sh'
      - '.github/workflows/build-web-offline-saver-ios.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash scripts/build_web_offline_saver_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebOfflineSaver-unsigned
          path: build-output/WebOfflineSaver.ipa
          if-no-files-found: error
