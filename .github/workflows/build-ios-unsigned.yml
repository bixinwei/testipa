name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: bash scripts/build_unsigned_ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HelloIPA-unsigned
          path: |
            build-output/HelloIPA.ipa
          if-no-files-found: error

  simulator-smoke-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare iPhone 16 Pro Max simulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Available runtimes:"
          xcrun simctl list runtimes available
          echo "Available device types:"
          xcrun simctl list devicetypes

          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes | sed -n 's/.*iPhone 16 Pro Max (\([^)]*\)).*/\1/p' | head -n 1)"
          RUNTIME_ID="$(xcrun simctl list runtimes available | sed -n 's/.*(\(com.apple.CoreSimulator.SimRuntime.iOS-[^)]*\)).*/\1/p' | tail -n 1)"
          if [[ -z "$DEVICE_TYPE_ID" || -z "$RUNTIME_ID" ]]; then
            echo "Could not find an iPhone 16 Pro Max device type or an iOS runtime" >&2
            exit 1
          fi

          DEVICE_UDID="$(xcrun simctl list devices available | sed -n 's/.*iPhone 16 Pro Max (\([0-9A-F-]*\)).*/\1/p' | head -n 1)"
          if [[ -z "$DEVICE_UDID" ]]; then
            DEVICE_UDID="$(xcrun simctl create 'iPhone 16 Pro Max' "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
            echo "Created iPhone 16 Pro Max ($DEVICE_UDID) using $RUNTIME_ID"
          else
            echo "Using existing iPhone 16 Pro Max ($DEVICE_UDID)"
          fi
          {
            echo "SIM_DEVICE_UDID=$DEVICE_UDID"
            echo "SIM_DEVICE_NAME=iPhone 16 Pro Max"
          } >> "$GITHUB_ENV"

      - name: Build simulator app
        run: |
          xcodebuild \
            -project HelloIPA.xcodeproj \
            -scheme HelloIPA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_DEVICE_UDID" \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Capture home, detail, and share title bars
        run: |
          set -euo pipefail
          DEVICE_NAME="iPhone 16 Pro Max"
          BUNDLE_ID="com.example.helloipa"
          APP_PATH="$(find build/Simulator -type d -name HelloIPA.app -print -quit)"
          mkdir -p build/simulator-screenshots

          xcrun simctl boot "$SIM_DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_DEVICE_UDID" -b
          xcrun simctl install "$SIM_DEVICE_UDID" "$APP_PATH"

          xcrun simctl launch "$SIM_DEVICE_UDID" "$BUNDLE_ID"
          sleep 2
          xcrun simctl io "$SIM_DEVICE_UDID" screenshot build/simulator-screenshots/home.png

          xcrun simctl terminate "$SIM_DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$SIM_DEVICE_UDID" "$BUNDLE_ID" -HelloIPA.ShowDetail
          sleep 2
          xcrun simctl io "$SIM_DEVICE_UDID" screenshot build/simulator-screenshots/detail.png

          xcrun simctl terminate "$SIM_DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$SIM_DEVICE_UDID" "$BUNDLE_ID" -HelloIPA.ShowShare
          sleep 2
          xcrun simctl io "$SIM_DEVICE_UDID" screenshot build/simulator-screenshots/share.png

      - name: Upload simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HelloIPA-iPhone-16-Pro-Max-screenshots
          path: build/simulator-screenshots
          if-no-files-found: error
